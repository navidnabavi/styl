name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commits: ${{ steps.commits.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate commit list
        id: commits
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline)
          fi
          echo "list<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  release:
    needs: prepare
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            test: false
            linker: aarch64-linux-gnu-gcc
            linker_pkg: gcc-aarch64-linux-gnu

          - os: macos-latest
            target: x86_64-apple-darwin
            test: false

          - os: macos-latest
            target: aarch64-apple-darwin
            test: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-linker
        if: matrix.linker_pkg != ''
        run: sudo apt-get install -y ${{ matrix.linker_pkg }}

      - name: Test
        if: matrix.test
        run: cargo test --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist

          VERSION="${GITHUB_REF_NAME}"

          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            BIN="dist/styl-${VERSION}-${{ matrix.target }}.exe"
            cp target/${{ matrix.target }}/release/styl.exe "$BIN"
            sha256sum "$BIN" > "${BIN}.sha256"
          else
            BIN="dist/styl-${VERSION}-${{ matrix.target }}"
            cp target/${{ matrix.target }}/release/styl "$BIN"
            sha256sum "$BIN" > "${BIN}.sha256"
          fi

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          body: ${{ needs.prepare.outputs.commits }}
