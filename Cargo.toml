[package]
name = "styl"
version = "0.1.0"
edition = "2021"

[lib]
name = "styl"
path = "src/lib.rs"

[[bin]]
name = "styl"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml       = "0.8"
thiserror  = "1"
indexmap   = { version = "2", features = ["serde"] }

[dev-dependencies]
insta      = "1"
tempfile   = "3"
