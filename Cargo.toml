[package]
name = "styl"
version = "0.0.6"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "Linter, validator, and formatter for MapLibre GL / Mapbox GL style JSON"
repository = "https://github.com/navidnabavi/styl"
keywords = ["maplibre", "mapbox", "map", "style", "linter"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "styl"
path = "src/lib.rs"

[[bin]]
name = "styl"
path = "src/main.rs"

[dependencies]
chrono     = { version = "0.4", features = ["serde"] }
clap       = { version = "4", features = ["derive"] }
csscolorparser = "0.8"
geojson    = "1"
html-escape = "0.2"
indexmap   = { version = "2", features = ["serde"] }
lsp-server = { version = "0.10", optional = true }
lsp-types  = { version = "0.97", optional = true }
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1.20"
thiserror  = "2"
toml       = "1.1"

[dev-dependencies]
insta      = "1"
lsp-server = "0.10"
lsp-types  = "0.97"
tempfile   = "3"

[features]
default = ["lsp"]
# The language server. Optional so library consumers can drop the LSP
# dependencies with `default-features = false`.
lsp = ["dep:lsp-server", "dep:lsp-types"]
