[package]
name = "mapbox-style-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mapbox-style-tool"
path = "src/main.rs"

[dependencies]
clap       = { version = "4", features = ["derive"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"
thiserror  = "1"
indexmap   = { version = "2", features = ["serde"] }

[dev-dependencies]
insta = "1"
