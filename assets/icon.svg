<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ea043"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <linearGradient id="accentVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ea043"/>
      <stop offset="100%" style="stop-color:#1a6430"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="18" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="512" height="512" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="0.8"/>
  </pattern>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#grid)" opacity="0.35" clip-path="url(#rounded)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="512" height="6" rx="0" fill="url(#accentGrad)" clip-path="url(#rounded)"/>

  <!-- Ambient green glow behind text -->
  <ellipse cx="256" cy="256" rx="160" ry="80" fill="#2ea043" opacity="0.07" filter="url(#softglow)"/>

  <!-- Main wordmark -->
  <text
    x="256"
    y="295"
    font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace"
    font-size="172"
    font-weight="700"
    fill="#e6edf3"
    text-anchor="middle"
    filter="url(#glow)"
  >styl</text>

  <!-- Green underline accent -->
  <rect x="96" y="318" width="320" height="6" rx="3" fill="url(#accentGrad)"/>


</svg>
